<a class="wordmark-bar" href="/" aria-label="Zur Startseite">
  <span class="wordmark-text">waendom.com</span>
  <svg class="wordmark-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
</a>

<button class="menu-toggle" aria-label="Menü öffnen" aria-expanded="false">
  <span></span><span></span><span></span>
</button>

<div class="menu-overlay">
  <span class="eyebrow">menu</span>
  <nav class="overlay-nav" aria-label="Hauptnavigation">
    <a href="/">home</a>
    <a href="/gallery/" aria-current="page">gallery</a>
    <a href="/about/">about waendom</a>
    <a href="/contact/">contact</a>
  </nav>
</div>

<main>
  <div class="wrap">
    <section class="page-head">
      <h1>gallery</h1>
      <p>Four collections. Pick one to see the individual works.</p>
    </section>

    <section class="category-grid">
      <a class="category-card" href="/gallery/digital/">
        <picture>
            <source srcset="/images/die-ruderer.webp" type="image/webp">
            <img src="/images/die-ruderer.jpg" data-full="/images/full/die-ruderer.jpg" alt="Digital painting after Kirchner: four rowers pulling long oars, sea and pale sky behind them" width="1200" height="990" loading="lazy" decoding="async">
          </picture>
        <span class="label">
          <span class="name">digital</span>
          <span class="sub">illustration</span>
        </span>
      </a>
      <a class="category-card" href="/gallery/canvas/">
        <picture>
            <source srcset="/images/canvas-03.webp" type="image/webp">
            <img src="/images/canvas-03.jpg" data-full="/images/full/canvas-03.jpg" alt="Oil study on canvas: a single eye and brow in close-up, painted in reddish brown over visible canvas weave" width="1200" height="1808" loading="lazy" decoding="async">
          </picture>
        <span class="label">
          <span class="name">canvas</span>
          <span class="sub">traditional</span>
        </span>
      </a>
      <a class="category-card" href="/gallery/analog/">
        <picture>
            <source srcset="/images/analog-01.webp" type="image/webp">
            <img src="/images/analog-01.jpg" data-full="/images/full/analog-01.jpg" alt="Film photograph: a red rescue helicopter hovering above rooftops in the pale light before sunset" width="1200" height="798" loading="lazy" decoding="async">
          </picture>
        <span class="label">
          <span class="name">analog</span>
          <span class="sub">photography</span>
        </span>
      </a>
      <a class="category-card" href="/gallery/sticker/">
        <picture>
            <source srcset="/images/sticker-alpenrod.webp" type="image/webp">
            <img src="/images/sticker-alpenrod.jpg" data-full="/images/full/sticker-alpenrod.jpg" alt="A waendom sticker on a lamppost, among other stickers" width="899" height="1599" loading="lazy" decoding="async">
          </picture>
        <span class="label">
          <span class="name">sticker</span>
          <span class="sub">in the wild</span>
        </span>
      </a>
    </section>
  </div>
</main>

<button class="to-top" aria-label="Nach oben">
